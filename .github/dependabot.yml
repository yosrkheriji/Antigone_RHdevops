# Mises a jour automatiques des dependances : chaque PR Dependabot passe
# par le pipeline CI/CD complet avant d'etre fusionnee.
#
# Les montees de version MAJEURE (Spring Boot 4, Java 25, Node 26...) sont
# ignorees : ce sont des migrations a planifier, pas des mises a jour de routine.
# Les versions mineures et correctives sont regroupees en une PR par ecosysteme
# pour limiter le nombre d'executions du pipeline (minutes Actions).
version: 2
updates:
  - package-ecosystem: maven
    directory: /Backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Images de base : on reste sur Java 17 et Node 22 (LTS) ; seuls les
  # correctifs de ces lignes sont proposes.
  - package-ecosystem: docker
    directories: [/Backend, /docker]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
