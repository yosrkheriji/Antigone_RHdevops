# Pile complete Antigone 360 : PostgreSQL + API Spring Boot + 3 frontends.
#
#   cp .env.example .env        # puis renseigner les secrets voulus
#   docker compose up -d --build
#
# Applications : RH http://localhost:3001 · Finance http://localhost:3002 ·
# Projets http://localhost:3000 · API http://localhost:8080 (Swagger : /swagger-ui.html)
#
# En CI, les images deja construites sont chargees puis lancees avec
# IMAGE_PREFIX/IMAGE_TAG et `--no-build` (cf. .github/workflows/docker.yml).

x-frontend-build: &frontend-build
  context: .
  dockerfile: docker/frontend.Dockerfile

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: antigone_rh
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d antigone_rh"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${IMAGE_PREFIX:-antigone}/backend:${IMAGE_TAG:-local}
    build:
      context: ./Backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/antigone_rh
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-docker-secret-at-least-32-chars}
      FRONTEND_URL: http://localhost:3000,http://localhost:3001,http://localhost:3002
      PUBLIC_BACKEND_URL: http://localhost:8080
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY_B64: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY_B64:-}
      GOOGLE_DRIVE_VIEWER_KEY_B64: ${GOOGLE_DRIVE_VIEWER_KEY_B64:-}
      JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
    volumes:
      - uploads:/app/uploads/justificatifs
    ports:
      - "8080:8080"

  frontend-rh:
    image: ${IMAGE_PREFIX:-antigone}/frontend-rh:${IMAGE_TAG:-local}
    build:
      <<: *frontend-build
      args: { APP: rh }
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "3001:8080"

  frontend-finance:
    image: ${IMAGE_PREFIX:-antigone}/frontend-finance:${IMAGE_TAG:-local}
    build:
      <<: *frontend-build
      args: { APP: finance }
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "3002:8080"

  frontend-projects:
    image: ${IMAGE_PREFIX:-antigone}/frontend-projects:${IMAGE_TAG:-local}
    build:
      <<: *frontend-build
      args: { APP: projects }
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "3000:8080"

volumes:
  pgdata:
  uploads:
